<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BREW &amp; CO. — Good Coffee. Good Art.</title>
<meta name="description" content="BREW & CO. specialty coffee and cold bar. Digital menu in English and Persian.">
<meta name="theme-color" content="#14100d">
<meta property="og:title" content="BREW & CO. — Good Coffee. Good Art.">
<meta property="og:description" content="Specialty coffee and cold bar. Browse 29 drinks in English or Persian.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2314100d'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='40' text-anchor='middle' fill='%23B8996A'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=DM+Sans:wght@400;500;600&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ================= VARIABLES ================= */
:root{
  --ivory:#F7F4EC; --paper:#EFEADD; --ink:#23211E; --espresso:#4A3426; --night:#14100d;
  --olive:#4F5B3A; --gold:#B8996A; --line:rgba(35,33,30,.16);
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-persian:'Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;
  --pad:clamp(20px,5vw,72px); --ease:cubic-bezier(.2,.7,.2,1);
}
/* ================= RESET ================= */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px;-webkit-text-size-adjust:100%}
body{background:var(--ivory);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.6;overflow-x:hidden;transition:opacity .2s}
body.swap{opacity:0}
body.lock{overflow:hidden}
img,svg{display:block;max-width:100%}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
/* ================= TYPOGRAPHY ================= */
.serif{font-family:var(--font-display);font-weight:300;letter-spacing:-.02em;line-height:.98}
.label{font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--olive);font-weight:600}
/* ================= LAYOUT ================= */
.wrap{padding-inline:var(--pad);max-width:1440px;margin-inline:auto}
section{padding-block:clamp(72px,11vw,150px)}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,48px)}
.head h2{font-size:clamp(2.6rem,6.5vw,5.6rem)}
/* ================= COMPONENTS ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 30px;background:var(--ink);color:var(--ivory);font-weight:500;transition:background .3s,transform .3s var(--ease)}
.btn:hover{background:var(--olive);transform:translateY(-2px)}.btn:active{transform:scale(.97)}
header{position:fixed;inset:0 0 auto 0;z-index:60;background:rgba(247,244,236,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:12px}
.logo{font-family:var(--font-display);font-size:1.4rem;font-weight:500;min-height:44px;display:flex;align-items:center;direction:ltr}
.nav-links{display:flex;gap:40px;list-style:none}
.nav-links a{padding:10px 2px;position:relative}
.nav-links a::after{content:"";position:absolute;inset-inline:0;bottom:4px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.nav-links a:hover::after{transform:scaleX(1)}
.tools{display:flex;align-items:center;gap:2px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
.langs{display:flex;align-items:center}
.lang{min-width:44px;min-height:44px;padding:0 6px;font-size:.88rem;font-weight:500;opacity:.55;transition:opacity .25s}
.lang[aria-pressed="true"]{opacity:1;text-decoration:underline;text-underline-offset:6px}
.langs i{width:1px;height:14px;background:var(--line)}
.burger{display:none}
.burger span{display:block;width:22px;height:1.5px;background:var(--ink);margin:6px auto;transition:transform .35s var(--ease),opacity .2s}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,16,13,.45);opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
.scrim.open{opacity:1;visibility:visible;transition:opacity .4s}
.mobile-menu{position:fixed;inset:68px 0 auto 0;z-index:50;background:var(--ivory);padding:12px var(--pad) 28px;clip-path:inset(0 0 100% 0);visibility:hidden;transition:clip-path .5s var(--ease),visibility 0s .5s}
.mobile-menu.open{clip-path:inset(0 0 -40px 0);visibility:visible;transition:clip-path .5s var(--ease)}
.mobile-menu a{display:block;font-family:var(--font-display);font-weight:300;font-size:clamp(2.2rem,11vw,3.2rem);line-height:1.2;padding:8px 0;border-bottom:1px solid var(--line);opacity:0;transform:translateY(14px);transition:opacity .4s,transform .5s var(--ease);transition-delay:0s}
.mobile-menu.open a{opacity:1;transform:none;transition-delay:calc(.12s + var(--k)*70ms)}
.status{display:inline-flex;align-items:center;gap:10px;font-size:.9rem;font-weight:500}
.status b{font-weight:600;letter-spacing:.06em}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--olive);box-shadow:0 0 0 0 rgba(79,91,58,.5);animation:pulse 2.4s infinite}
.status.closed .dot{background:transparent;border:1.5px solid var(--espresso);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(79,91,58,0)}100%{box-shadow:0 0 0 0 rgba(79,91,58,0)}}
/* ================= HERO ================= */
.hero{padding-top:68px;min-height:100vh;min-height:100svh;display:grid;grid-template-columns:1fr 1.1fr;align-items:center;gap:clamp(20px,4vw,64px)}
.hero-copy{padding-block:60px}
.hero h1{font-size:clamp(3.4rem,9.2vw,8.4rem);margin:20px 0 28px}
.ln{display:block;overflow:hidden;padding-bottom:.1em}
.ln>span{display:block;transform:translateY(108%);animation:lineup 1s var(--ease) forwards;animation-delay:var(--d)}
.ln.em{padding-inline-start:.6em;font-style:italic;color:var(--espresso)}
.lead{max-width:36ch;font-size:clamp(1rem,1.3vw,1.15rem);color:#4a4741;margin-bottom:32px}
.hero .status{margin-top:28px;display:flex}
.hero-art{position:relative;aspect-ratio:4/5;max-height:84vh;width:100%;direction:ltr}
.shape,.leaf,.bean{position:absolute}
.s1{inset:6% 8% 10% 14%;background:var(--olive)}
.s2{width:34%;aspect-ratio:1;right:2%;top:2%;border-radius:50%;background:var(--gold);opacity:.85}
.s3{width:26%;height:38%;left:0;bottom:6%;background:var(--paper);border:1px solid var(--ink)}
.hero-drink{position:absolute;left:50%;top:50%;width:62%;transform:translate(-50%,-50%);filter:drop-shadow(0 30px 30px rgba(0,0,0,.28))}
.leaf{width:30%}.leaf.a{right:-2%;bottom:8%}.leaf.b{left:2%;top:4%;width:22%}
.bean{width:7%}
.load,.shape,.leaf,.bean,.hero-drink{opacity:0}
.load{transform:translateY(28px);animation:up .9s var(--ease) forwards;animation-delay:var(--d,0s)}
.shape{animation:fade 1.1s var(--ease) forwards;animation-delay:var(--d,.3s)}
.leaf,.bean{animation:fade 1.1s var(--ease) forwards,float 9s ease-in-out infinite alternate;animation-delay:var(--d,.3s),2.4s}
.hero-drink{clip-path:inset(0 0 100% 0);animation:reveal 1.2s var(--ease) .5s forwards,fade .4s .5s forwards}
body:not(.ready) :is(.load,.ln>span,.shape,.leaf,.bean,.hero-drink){animation-play-state:paused}
@keyframes up{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes lineup{to{transform:none}}
@keyframes reveal{to{clip-path:inset(-10%)}}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-8px)}}
/* ================= MENU ================= */
.tabs{display:flex;border:1px solid var(--ink);overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:48px;padding:0 24px;font-weight:500;white-space:nowrap;transition:background .3s,color .3s}
.tab[aria-selected="true"]{background:var(--ink);color:var(--ivory)}
.search{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ink);margin-bottom:clamp(28px,4vw,48px);max-width:460px}
.search svg{width:20px;height:20px;stroke:var(--espresso);fill:none;stroke-width:1.5;flex:none}
.search input{flex:1;min-width:0;min-height:48px;outline:0}
.search:focus-within{border-color:var(--olive);box-shadow:0 1px 0 var(--olive)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(20px,2.4vw,36px) clamp(16px,2vw,28px);transition:opacity .18s,transform .18s}
.grid.out{opacity:0;transform:translateY(8px)}
.card{position:relative;opacity:0;transform:translateY(18px);animation:up .6s var(--ease) forwards;animation-delay:calc(var(--i)*45ms)}
.open{display:flex;flex-direction:column;width:100%;text-align:start}
.ph{aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden;position:relative;transition:box-shadow .4s}
.ph svg{width:62%;transition:transform .7s var(--ease)}
.card:hover .ph{box-shadow:0 18px 36px -18px rgba(35,33,30,.45)}
.card:hover .ph svg{transform:scale(1.07) translateY(-4px)}
.card .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:14px}
.nm{font-family:var(--font-display);font-weight:500;font-size:1.4rem;letter-spacing:-.01em;line-height:1.2}
.price{font-weight:600;color:var(--olive);white-space:nowrap}
.d{font-size:.93rem;color:#5a564e;margin:6px 0 10px}
.view{font-weight:600;font-size:.9rem;border-bottom:1px solid var(--ink);align-self:flex-start;transition:padding .3s var(--ease)}
.card:hover .view{padding-inline-end:10px}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:var(--ivory);padding:3px 10px;font-size:.75rem;font-weight:600}
.fav{position:absolute;top:2px;inset-inline-end:2px;width:44px;height:44px;display:grid;place-items:center;color:var(--ink);z-index:2}
.fav::before{content:"";position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(247,244,236,.92);transition:transform .3s var(--ease)}
.fav:hover::before{transform:scale(1.1)}
.fav svg{position:relative;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;transition:transform .35s var(--ease),fill .25s}
.fav.on svg{fill:#c8553d;stroke:#c8553d;animation:pop .4s var(--ease)}
@keyframes pop{50%{transform:scale(1.22)}}
.card.sig .ph::after{content:"";position:absolute;inset:10px;border:1px solid var(--gold);pointer-events:none}
.card.sig .nm{color:var(--espresso)}
.card.sig .ph svg{width:68%}
.empty{grid-column:1/-1;padding:60px 0;text-align:center}
.empty h3{font-family:var(--font-display);font-weight:300;font-size:clamp(1.8rem,5vw,2.8rem)}
.empty p{color:#5a564e;margin-top:8px}
/* ================= GALLERY ================= */
.gallery{background:var(--paper)}
.g{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:clamp(110px,14vw,200px);gap:clamp(12px,2vw,28px)}
.tile{position:relative;overflow:hidden;display:grid;place-items:center}
.tile svg{width:56%;max-height:86%;transition:transform .9s var(--ease)}
.tile:hover svg{transform:scale(1.07) translate(-2px,-4px)}
.tile figcaption{position:absolute;inset-inline-start:16px;bottom:12px;font-family:var(--font-display);font-style:italic;font-size:1.05rem;color:var(--ivory)}
.t1{grid-column:1/6;grid-row:1/4;background:var(--olive)}
.t2{grid-column:6/9;grid-row:1/3;background:var(--gold)}
.t3{grid-column:9/13;grid-row:1/4;background:var(--espresso)}
.t4{grid-column:6/9;grid-row:3/5;background:#c9753a}
.t5{grid-column:1/6;grid-row:4/6;background:#d9cfb8}.t2 figcaption,.t5 figcaption{color:var(--ink)}
.t6{grid-column:9/13;grid-row:4/6;background:#6e7b52}
/* ================= ABOUT ================= */
.about{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(32px,6vw,100px);align-items:end}
.about h2{font-size:clamp(2.8rem,7vw,6.4rem)}
.about p{font-size:1.1rem;max-width:46ch;color:#4a4741}
.stats{margin-top:28px;border-top:1px solid var(--line)}
.stats div{padding:14px 0;border-bottom:1px solid var(--line);font-family:var(--font-display);font-size:1.5rem}
/* ================= FOOTER ================= */
footer{background:var(--night);color:var(--ivory);padding:clamp(56px,8vw,96px) 0 40px}
.f{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
footer .logo{font-size:clamp(2rem,4vw,3rem)}
footer h4{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
footer p,footer a{font-size:.95rem;color:#d8d3c6}
footer a{display:inline-flex;align-items:center;min-height:44px}
footer .status{color:var(--ivory);margin-top:12px}
footer .status .dot{background:#9bb06a}footer .status.closed .dot{background:transparent;border-color:var(--gold)}
footer .lang{color:var(--ivory)}
.legal{margin-top:44px;padding-top:20px;border-top:1px solid rgba(255,255,255,.15);font-size:.82rem;color:#9b968a;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sticky{display:none}
/* ================= MODAL ================= */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(20,16,13,.6);display:grid;place-items:center;padding:16px;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.overlay.open{opacity:1;visibility:visible;transition:opacity .35s}
.modal{background:var(--ivory);width:min(920px,100%);max-height:calc(100dvh - 32px);overflow:auto;display:grid;grid-template-columns:1fr 1fr;position:relative;transform:translateY(30px) scale(.97);transition:transform .5s var(--ease)}
.overlay.open .modal{transform:none}
.m-img{display:grid;place-items:center;padding:32px;position:relative}
.m-img svg{width:min(70%,260px)}
.m-body{padding:clamp(24px,4vw,48px);display:flex;flex-direction:column;justify-content:center;gap:14px}
.m-body h3{font-size:clamp(2.2rem,5vw,3.4rem)}
.m-body h4{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--olive)}
.m-price{font-family:var(--font-display);font-size:2rem;color:var(--espresso)}
.close{position:absolute;top:8px;inset-inline-end:8px;z-index:2;width:44px;height:44px;background:var(--ivory);font-size:1.5rem;border-radius:50%;line-height:1}
/* ================= PROGRESS / GHOST / FEATURE / VISIT ================= */
#bar{position:fixed;top:0;inset-inline:0;height:2px;z-index:70;background:var(--olive);transform:scaleX(0);transform-origin:left}
[dir="rtl"] #bar{transform-origin:right}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--ivory)}
.btn.light{background:var(--ivory);color:var(--ink)}.btn.light:hover{background:var(--gold)}
.fav.mfav{top:8px;inset-inline-start:8px;inset-inline-end:auto;background:none}
.feature{background:var(--night);color:var(--ivory)}
.feature .wrap,.visit .wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,6vw,96px);align-items:center}
.f-art{position:relative;aspect-ratio:1;max-width:500px;width:100%;margin-inline:auto;display:grid;place-items:center;direction:ltr}
.f-art::before{content:"";position:absolute;inset:9%;border-radius:50%;background:var(--olive)}
.f-art::after{content:"";position:absolute;inset:0;border:1px solid var(--gold);border-radius:50%}
.f-art svg{position:relative;width:42%;filter:drop-shadow(0 26px 24px rgba(0,0,0,.4));transition:transform .8s var(--ease)}
.f-art:hover svg{transform:translateY(-6px) rotate(-2deg)}
.feature .label{color:var(--gold)}
.feature h2{font-size:clamp(2.4rem,6vw,5rem);margin:14px 0 16px}
.fd{max-width:40ch;color:#d8d3c6;font-size:1.1rem}
.feature .price{display:block;font-family:var(--font-display);font-size:2rem;color:var(--gold);margin:18px 0 26px}
.visit{background:var(--paper)}
.visit h2{font-size:clamp(2.6rem,6.5vw,5.6rem);margin-bottom:20px}
.visit p{max-width:42ch;color:#4a4741}
.v-list{margin:24px 0;border-top:1px solid var(--line)}
.v-list div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.v-list b{font-weight:600;text-align:end}
.v-btns{display:flex;gap:12px;flex-wrap:wrap}
.map{border:1px solid var(--ink);min-height:360px;height:100%;position:relative;overflow:hidden;direction:ltr}
.map svg{position:absolute;inset:0;width:100%;height:100%}
/* ================= SCROLL REVEAL ================= */
.rv{opacity:0;transform:translateY(32px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}
/* ================= RESPONSIVE ================= */
@media (max-width:1024px){.grid{grid-template-columns:repeat(2,1fr)}.f{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .nav-links,.tools .desk{display:none}.burger{display:grid}.logo{font-size:1.2rem}
  .hero{grid-template-columns:1fr;min-height:0;gap:0;padding-top:76px}
  .hero-copy{display:contents}
  .hero .label{order:1;margin-top:20px}.hero h1{order:2;font-size:clamp(3.2rem,16vw,6rem);margin:14px 0 8px}
  .hero-art{order:3;width:min(100%,520px);max-height:none;aspect-ratio:1/1.02;margin:8px auto 28px;overflow:hidden;isolation:isolate}
  .leaf.a{right:0}.bean,.leaf{animation-iteration-count:1}
  .hero .lead{order:4;margin-bottom:24px;position:relative;z-index:1}.hero .btn{order:5;align-self:flex-start}.hero .status{order:6}
  .about,.feature .wrap,.visit .wrap{grid-template-columns:1fr}
  .f-art{max-width:340px}.map{min-height:280px;height:280px}.v-btns .btn{flex:1}
  .modal{grid-template-columns:1fr}.overlay{align-items:end;padding:0}
  .modal{max-height:92dvh;transform:translateY(100%);width:100%}
  .m-img{padding:44px 24px 12px}.m-img svg{width:min(46%,170px)}
  .sticky{display:flex;position:fixed;inset-inline:16px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;transform:translateY(160%);transition:transform .5s var(--ease)}
  .sticky.show{transform:none}.sticky .btn{width:100%;box-shadow:0 10px 24px rgba(0,0,0,.25)}
  footer{padding-bottom:100px}
}
@media (max-width:620px){
  .grid{grid-template-columns:1fr;gap:24px}
  .open{display:grid;grid-template-columns:44% 1fr;column-gap:16px;align-content:start}
  .ph{grid-row:1/4;aspect-ratio:1/1.15}
  .card .row{margin-top:0;flex-direction:column;gap:2px;align-self:end}
  .d{align-self:start;margin:8px 0 6px}.view{align-self:end;min-height:44px;display:inline-flex;align-items:center}
  .fav{inset-inline-end:auto;inset-inline-start:2px}.badge{top:auto;bottom:8px}
  .g{grid-template-columns:1fr;grid-auto-rows:auto}
  .tile{grid-column:1!important;grid-row:auto!important;aspect-ratio:4/3}.t1,.t3{aspect-ratio:1/1}
  .t2,.t5{width:88%}.t4,.t6{width:88%;margin-inline-start:auto}
  .f{grid-template-columns:1fr}
}
@media (max-width:340px){.hero h1{font-size:2.9rem}.tab{padding:0 16px}.lang{min-width:40px}}
/* ================= RTL ================= */
[dir="rtl"] body{font-family:var(--font-persian)}
[dir="rtl"] .serif,[dir="rtl"] .nm,[dir="rtl"] .m-price,[dir="rtl"] .stats div,[dir="rtl"] .empty h3,[dir="rtl"] .mobile-menu a,[dir="rtl"] .tile figcaption{font-family:var(--font-persian);font-weight:500;letter-spacing:0;font-style:normal}
[dir="rtl"] .serif{line-height:1.3}
[dir="rtl"] .ln{padding-bottom:.18em}
[dir="rtl"] .ln.em{font-style:normal}
[dir="rtl"] .label,[dir="rtl"] footer h4,[dir="rtl"] .m-body h4{letter-spacing:0;text-transform:none}
[dir="rtl"] .hero h1{font-size:clamp(3rem,8vw,7rem)}
[dir="rtl"] .nav-links a::after{transform-origin:right}
@media (max-width:820px){[dir="rtl"] .hero h1{font-size:clamp(2.9rem,14vw,5rem)}}
/* ================= REDUCED MOTION ================= */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}

].map((r,i)=>({id:'p'+i,cat:r[0],name:r[1],desc:r[2],ing:r[3].split(' '),art:r[4],price:r[5],badge:r[6],
  bg:r[0]==='sig'?'#2b2019':['#d9cfb8','#cfd5bd','#e3d5bf','#d8cdb0','#c3cba8','#d6cbb2'][i%6]}));

/* ================= ILLUSTRATIONS ================= */
function drinkSVG(p, label){
  const a = label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"', s = p.art;
  if(s.k==='g'){
    const [t,m,b]=s.y;
    const g = {lemon:'<circle cx="112" cy="34" r="20" fill="#f2d24a"/><circle cx="112" cy="34" r="15" fill="#f8e98a"/><path d="M112 20v28M98 34h28M102 24l20 20M122 24l-20 20" stroke="#f2d24a" stroke-width="2"/>',
      orange:'<circle cx="112" cy="34" r="20" fill="#f08a24"/><circle cx="112" cy="34" r="15" fill="#f7b45a"/><path d="M112 20v28M98 34h28" stroke="#f08a24" stroke-width="2"/>',
      mint:'<path d="M96 30C96 8 118 8 120 22 112 34 100 36 96 30ZM108 34C112 14 134 18 130 32 122 40 112 40 108 34Z" fill="#4F8a3a"/>',
      berry:'<circle cx="104" cy="28" r="9" fill="#c0304a"/><circle cx="119" cy="24" r="8" fill="#7a2a5a"/><circle cx="112" cy="38" r="8" fill="#a02a4a"/>'}[s.g]||'';
    return `<svg viewBox="0 0 140 220" ${a}><defs><clipPath id="cg"><path d="M30 30h80l-9 170a8 8 0 0 1-8 7H47a8 8 0 0 1-8-7z"/></clipPath></defs>
    <g clip-path="url(#cg)"><rect x="20" y="30" width="100" height="190" fill="${b}"/><rect x="20" y="30" width="100" height="110" fill="${m}"/><rect x="20" y="30" width="100" height="55" fill="${t}"/>
    <rect x="42" y="60" width="30" height="30" rx="4" fill="#fff" opacity=".28" transform="rotate(14 57 75)"/><rect x="72" y="110" width="30" height="30" rx="4" fill="#fff" opacity=".22" transform="rotate(-10 87 125)"/><rect x="46" y="150" width="28" height="28" rx="4" fill="#fff" opacity=".2" transform="rotate(8 60 164)"/></g>
    <path d="M30 30h80l-9 170a8 8 0 0 1-8 7H47a8 8 0 0 1-8-7z" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2.5"/>
    <path d="M38 40l8 150" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    <rect x="86" y="2" width="6" height="140" rx="3" fill="#4F5B3A" transform="rotate(12 89 70)"/>${g}</svg>`;
  }
  const h=s.t?46:30, y=64-h/3;
  return `<svg viewBox="0 0 180 160" ${a}><ellipse cx="90" cy="144" rx="72" ry="10" fill="#000" opacity=".15"/><ellipse cx="90" cy="128" rx="68" ry="12" fill="#fff"/>
    <path d="M44 ${y}h92l-8 ${58+h/3}a14 14 0 0 1-14 11H66a14 14 0 0 1-14-11z" fill="#F7F4EC"/>
    <path d="M136 74c26-4 26 34-6 34" fill="none" stroke="#F7F4EC" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="90" cy="${y}" rx="46" ry="9" fill="${s.l}"/>
    ${s.f?`<ellipse cx="90" cy="${y}" rx="40" ry="7" fill="#f4e8d4"/><path d="M90 ${y-4}c-8 0-10 3-4 4 4 1 4 3 4 3 0-3 0-2 4-3 6-1 4-4-4-4z" fill="${s.l}"/>`:''}</svg>`;
}
function extraArt(type){ // gallery: beans, orange, foam
  const bean='<ellipse cx="0" cy="0" rx="16" ry="25" fill="#4A3426"/><path d="M0-22C-9-6 9 8 0 22" stroke="#2a1d14" stroke-width="3" fill="none"/>';
  if(type==='bean') return `<svg viewBox="0 0 160 160" aria-hidden="true"><g transform="translate(50 60) rotate(-25)">${bean}</g><g transform="translate(105 50) rotate(30)">${bean}</g><g transform="translate(80 110) rotate(70)">${bean}</g></svg>`;
  if(type==='orange') return `<svg viewBox="0 0 160 160" aria-hidden="true"><circle cx="80" cy="80" r="62" fill="#f08a24"/><circle cx="80" cy="80" r="52" fill="#f7c26a"/><g stroke="#f08a24" stroke-width="3"><path d="M80 28v104M28 80h104M43 43l74 74M117 43l-74 74"/></g></svg>`;
  return `<svg viewBox="0 0 160 160" aria-hidden="true"><circle cx="80" cy="80" r="66" fill="#F7F4EC"/><circle cx="80" cy="80" r="52" fill="#a77a55"/><path d="M80 44c-26 0-30 20-8 24 20 3 8 22 8 22s-4-6 14-10c24-6 22-36-14-36z" fill="#f4e8d4"/><path d="M146 80c18-3 12 30-4 28" fill="none" stroke="#F7F4EC" stroke-width="8"/></svg>`;
}
const GAL = [['t1','p12','g1'],['t2','bean','g2'],['t3','p28','g3'],['t4','orange','g4'],['t5','foam','g5'],['t6','p23','g6']];

/* ================= HELPERS ================= */
const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lang = 'en', cat = 'all', query = '', openId = null;
try{ lang = localStorage.getItem('brew-lang') || 'en'; }catch(e){}
let favs = new Set(); try{ favs = new Set(JSON.parse(localStorage.getItem('brew-favs')||'[]')); }catch(e){}
const L = () => lang==='fa'?1:0, tr = k => T[lang][k];
const money = n => new Intl.NumberFormat(lang==='fa'?'fa-IR':'en-US',{style:'currency',currency:'USD'}).format(n);
const norm = s => s.toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u200c\s]+/g,' ').trim();
const catName = c => tr({coffee:'c_coffee',cold:'c_cold',sig:'c_sig'}[c]);
const ingText = p => p.ing.map(k=>ING[k][L()]).join(lang==='fa'?'، ':', ');
const HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';

/* ================= MENU: FILTER + SEARCH ================= */
const grid = $('#grid');
function buildGrid(){
  const q = norm(query);
  const list = P.filter(p => (cat==='all'||(cat==='fav'?favs.has(p.id):p.cat===cat)) && (!q || p.name.some(n=>norm(n).includes(q))));
  grid.innerHTML = list.length ? list.map((p,i)=>`
    <article class="card ${p.cat==='sig'?'sig':''}" style="--i:${Math.min(i,12)}">
      <button class="open" data-id="${p.id}">
        <span class="ph" style="background:${p.bg}">${drinkSVG(p)}${p.badge?`<span class="badge">${tr('pop')}</span>`:''}</span>
        <span class="row"><span class="nm">${p.name[L()]}</span><span class="price">${money(p.price)}</span></span>
        <span class="d">${p.desc[L()]}</span><span class="view">${tr('view')}</span>
      </button>
      <button class="fav ${favs.has(p.id)?'on':''}" data-fav="${p.id}" aria-pressed="${favs.has(p.id)}" aria-label="${tr('fav')}: ${p.name[L()]}">${HEART}</button>
    </article>`).join('')
    : `<div class="empty"><h3>${tr(cat==='fav'&&!q?'fav_empty_t':'empty_t')}</h3><p>${tr('empty_d')}</p></div>`;
}
function renderMenu(animate=true){
  if(!animate||reduce){ buildGrid(); return; }
  grid.classList.add('out');
  setTimeout(()=>{ buildGrid(); grid.classList.remove('out'); }, 180);
}
$('#tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if(!t) return;
  cat = t.dataset.cat;
  $$('.tab').forEach(x => x.setAttribute('aria-selected', x===t));
  t.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  renderMenu();
});
let qTimer; $('#q').addEventListener('input', e => { query = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(()=>renderMenu(), 120); });

/* ================= FAVORITES ================= */
function favLabel(){
  const n = favs.size, num = n.toLocaleString(lang==='fa'?'fa-IR':'en');
  $('#favTab').textContent = tr('c_fav') + (n ? ' · ' + num : '');
}
function toggleFav(id){
  favs.has(id) ? favs.delete(id) : favs.add(id);
  $$('[data-fav="'+id+'"]').forEach(b => { b.classList.toggle('on', favs.has(id)); b.setAttribute('aria-pressed', favs.has(id)); });
  try{ localStorage.setItem('brew-favs', JSON.stringify([...favs])); }catch(err){}
  favLabel();
}
function fillFeature(){
  const p = P[24];
  $('#featArt').innerHTML = drinkSVG(p, p.name[L()]);
  $('#featTitle').textContent = p.name[L()]; $('#featDesc').textContent = p.desc[L()]; $('#featPrice').textContent = money(p.price);
}
grid.addEventListener('click', e => {
  const f = e.target.closest('.fav');
  if(f){ toggleFav(f.dataset.fav); return; }
  const o = e.target.closest('.open'); if(o) openModal(o.dataset.id);
});

/* ================= PRODUCT MODAL ================= */
const overlay = $('#overlay'); let lastFocus = null;
function fillModal(){
  const p = P.find(x=>x.id===openId); if(!p) return;
  $('#mImg').style.background = p.bg; $('#mImg').innerHTML = drinkSVG(p, p.name[L()]);
  $('#mCat').textContent = catName(p.cat) + (p.badge ? ' · ' + tr('pop') : '');
  const mf = $('#mFav'); mf.dataset.fav = p.id; mf.classList.toggle('on', favs.has(p.id)); mf.setAttribute('aria-pressed', favs.has(p.id));
  $('#mName').textContent = p.name[L()]; $('#mDesc').textContent = p.desc[L()];
  $('#mIng').textContent = ingText(p); $('#mPrice').textContent = money(p.price);
}
function openModal(id){
  openId = id; lastFocus = document.activeElement; fillModal();
  overlay.classList.add('open'); overlay.setAttribute('aria-hidden','false');
  document.body.classList.add('lock'); $('#closeModal').focus();
}
function closeModal(){
  overlay.classList.remove('open'); overlay.setAttribute('aria-hidden','true'); openId = null;
  document.body.classList.remove('lock'); lastFocus && lastFocus.focus();
}
$('#closeModal').addEventListener('click', closeModal);
$('#mFav').addEventListener('click', () => toggleFav(openId));
$('#featBtn').addEventListener('click', () => openModal('p24'));
overlay.addEventListener('click', e => { if(e.target===overlay) closeModal(); });

/* ================= NAVIGATION ================= */
const burger = $('#burger'), mm = $('#mobileMenu'), scrim = $('#scrim');
function setMenu(open){
  [mm,scrim].forEach(x=>x.classList.toggle('open',open)); mm.setAttribute('aria-hidden',!open);
  burger.setAttribute('aria-expanded',open); document.body.classList.toggle('lock',open);
}
burger.addEventListener('click', () => setMenu(!mm.classList.contains('open')));
scrim.addEventListener('click', () => setMenu(false));
$('#searchBtn').addEventListener('click', () => { $('#menu').scrollIntoView({behavior:reduce?'auto':'smooth'}); setTimeout(()=>$('#q').focus({preventScroll:true}),500); });
$$('a[href^="#"]').forEach(a => a.addEventListener('click', e => {
  const t = $(a.getAttribute('href')); if(!t) return; e.preventDefault(); setMenu(false); t.scrollIntoView({behavior:'smooth'});
}));
document.addEventListener('keydown', e => {
  if(e.key==='Tab' && overlay.classList.contains('open')){
    const f = $$('button', overlay), a = f[0], z = f[f.length-1];
    if(e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); }
    else if(!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); }
    return;
  }
  if(e.key!=='Escape') return;
  if(overlay.classList.contains('open')) closeModal(); else if(mm.classList.contains('open')) setMenu(false);
});

/* ================= LANGUAGE SWITCHING ================= */
function applyLang(){
  const h = document.documentElement; h.lang = lang; h.dir = lang==='fa'?'rtl':'ltr';
  $$('[data-i18n]').forEach(el => el.textContent = tr(el.dataset.i18n));
  $$('[data-i18n-ph]').forEach(el => el.placeholder = tr(el.dataset.i18nPh));
  $$('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', tr(el.dataset.i18nAria)));
  $$('.lang').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang===lang));
  document.title = lang==='fa' ? 'BREW & CO. — قهوهٔ خوب. هنر خوب.' : 'BREW & CO. — Good Coffee. Good Art.';
  $('#heroDrink').setAttribute('aria-label', P[12].name[L()]);
  $('#galleryGrid').innerHTML = GAL.map(([c,a,cap]) => {
    const p = P[+a.slice(1)];
    return `<figure class="tile ${c}">${a[0]==='p'?drinkSVG(p,p.name[L()]):extraArt(a)}<figcaption>${tr(cap)}</figcaption></figure>`;
  }).join('');
  buildGrid(); fillModal(); updateStatus(); fillFeature(); favLabel();
}
function setLang(l){
  if(l===lang) return; lang = l; try{ localStorage.setItem('brew-lang', l); }catch(e){}
  if(reduce){ applyLang(); return; }
  document.body.classList.add('swap'); setTimeout(()=>{ applyLang(); document.body.classList.remove('swap'); }, 200);
}
$$('.lang').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

/* ================= LIVE STATUS ================= */
function updateStatus(){
  const h = new Date().getHours(), isOpen = h>=8 && h<23;
  $$('.status').forEach(s => { s.classList.toggle('closed',!isOpen);
    s.innerHTML = `<span class="dot"></span><b>${tr(isOpen?'open':'closed')}</b><span>${tr('hours')}</span>`; });
}
setInterval(updateStatus, 30000);

/* ================= SCROLL ANIMATION ================= */
const io = new IntersectionObserver(es => es.forEach(x => { if(x.isIntersecting){ x.target.classList.add('in'); io.unobserve(x.target); } }), {threshold:.1});
$$('.rv').forEach(el => io.observe(el));
const sticky = $('#sticky'), menuSec = $('#menu'), foot = $('footer');
const bar = $('#bar');
window.addEventListener('scroll', () => {
  bar.style.transform = 'scaleX(' + (scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight)).toFixed(3) + ')';
  const r = menuSec.getBoundingClientRect();
  sticky.classList.toggle('show', scrollY>200 && (r.top>innerHeight || r.bottom<0) && foot.getBoundingClientRect().top>innerHeight);
}, {passive:true});
if(!reduce){ // parallax: desktop only, small and clamped, so hero art never drifts over text
  const items = $$('[data-p]'), wide = matchMedia('(min-width:821px)'); let tick = false;
  const move = () => { const y = wide.matches ? Math.min(scrollY, innerHeight) : 0;
    items.forEach(el => el.style.translate = y ? '0 ' + Math.max(-40, Math.min(40, y*parseFloat(el.dataset.p)*1.2)).toFixed(1) + 'px' : ''); tick = false; };
  window.addEventListener('scroll', () => { if(!tick){ tick = true; requestAnimationFrame(move); } }, {passive:true});
  wide.addEventListener('change', move);
}

/* ================= INIT ================= */
$('#heroDrink').innerHTML = drinkSVG(P[12]); $('#mFav').innerHTML = HEART;
applyLang();
</script>
</body>
</html>
