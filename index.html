<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#09051c" />
  <title>POP! — Tiny Game, Big Happiness</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <main id="game">
    <canvas id="gameCanvas"></canvas>

    <div class="hud">
      <div class="hud-block">
        <span class="label">SCORE</span>
        <span id="score" class="value">0</span>
      </div>

      <div class="hud-block combo-block">
        <span class="label">COMBO</span>
        <span id="combo" class="value">x0</span>
      </div>
    </div>

    <button id="muteButton" class="mute-button" aria-label="Toggle sound">🔊</button>

    <div id="startOverlay" class="overlay">
      <div class="title-wrap">
        <div class="sparkle">✦</div>
        <h1>POP<span>!</span></h1>
        <p>A tiny game about making<br />satisfying things happen.</p>
      </div>
      <button id="startButton">TAP TO PLAY</button>
    </div>

    <div id="hint" class="hint">Tap a bubble ✦ — tap the center for PERFECT</div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
